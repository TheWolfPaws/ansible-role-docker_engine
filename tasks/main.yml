---
# tasks file for docker
- name: APT install package
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    pkg:
      - ca-certificates
      - curl
  become: true

- name: Dossier Keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Add Docker’s official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/debian
    suites:
      - "{{ ansible_distribution_release }}"
    components:
      - stable
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  become: true

- name: APT update
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: APT install docker
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
  become: true

- name: Ajouter l'user au group
  ansible.builtin.user:
    name: "{{ docker_engine_user }}"
    groups: docker
    append: true
  become: true
  when: docker_engine_user != ""

- name: Configurer le démon Docker
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Redémarrer le service Docker

- name: Démarrer le service Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  become: true
