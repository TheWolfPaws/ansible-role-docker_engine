---
# defaults file for docker
docker_engine_user: ""

docker_engine_log_max_size: "20m"
docker_engine_log_max_file: "5"
docker_engine_log_compress: "true"

docker_engine_address_pools:
  - base: "172.20.0.0/16"
    size: 24

docker_engine_metrics_addr: ""

docker_engine_data_root: ""

docker_engine_no_new_privileges: false
